<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    compress-pdf-solid: a solid document with a crescent bitten out of each side and a
    rounded arrowhead sitting in the bite, pointing inward = compress.
    The bites are carved with a mask so the gap stays a clean crescent at any size.
  -->
  <defs>
    <mask id="bite">
      <rect width="64" height="64" fill="#000"/>
      <rect x="14" y="7" width="36" height="50" rx="5" fill="#fff"/>
      <circle cx="11.5" cy="32" r="6.5" fill="#000"/>
      <circle cx="52.5" cy="32" r="6.5" fill="#000"/>
    </mask>
  </defs>

  <g fill="#26408B">
    <rect x="14" y="7" width="36" height="50" rx="5" mask="url(#bite)"/>
    <path d="M7 25.5 L15 32 L7 38.5 Z" stroke="#26408B" stroke-width="3" stroke-linejoin="round"/>
    <path d="M57 25.5 L49 32 L57 38.5 Z" stroke="#26408B" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g fill="#C2E7D9">
    <rect x="23" y="17" width="18" height="5.5" rx="2.75"/>
    <rect x="22" y="29.25" width="20" height="5.5" rx="2.75"/>
    <rect x="23" y="41.5" width="18" height="5.5" rx="2.75"/>
  </g>
</svg>
